plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.99'
}

version = '0.2.0-alpha'
group = 'com.nightfall'
base { archivesName = 'nightfall-mca-voice-ai' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = '21.1.235'
    runs {
        client { client() }
        server { server() }
    }
    mods {
        nightfall_voice {
            sourceSet(sourceSets.main)
        }
    }
}

repositories {
    maven { url = 'https://maven.maxhenkel.de/repository/public' }
}

dependencies {
    // The classes are provided at runtime by the actual Simple Voice Chat mod.
    compileOnly 'de.maxhenkel.voicechat:voicechat-api:2.6.20'
}

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
