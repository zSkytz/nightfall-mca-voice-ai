name: Build Nightfall MCA Voice AI
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Compile and package NeoForge mod
        run: gradle --no-daemon build
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: Nightfall-MCA-Voice-AI-NeoForge-1.21.1
          path: build/libs/*.jar
